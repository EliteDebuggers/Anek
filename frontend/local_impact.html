<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Anek | Civic Map & local Pulse</title>
    <link rel="icon" type="image/svg+xml" href="/images/leaf.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&amp;family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Manrope:wght@200..800&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="/src/main.js"></script>
</head>

<body
    class="bg-background text-on-surface selection:bg-primary selection:text-on-primary min-h-screen flex flex-col transition-colors duration-500 relative">

    <img id="global-bg-image" src="/images/tree.png" alt="Anēk Background"
        class="fixed inset-0 w-full h-full object-cover object-center z-[-1]" />

    <anek-header></anek-header>

    <div class="flex flex-1">

        <anek-sidebar></anek-sidebar>

        <main class="flex-grow p-4 md:p-8 space-y-6 transition-all overflow-x-hidden animate-fade-in">
            <!-- Hero Section -->
            <section class="flex flex-col md:flex-row md:items-start justify-between gap-8 mb-8 animate-slide-up">
                <div class="max-w-xl">
                    <h1
                        class="font-cabin text-4xl md:text-6xl text-white font-bold leading-tight select-none flex items-center gap-2 md:gap-4 drop-shadow-md">
                        <span class="material-symbols-outlined text-3xl md:text-5xl">map</span> Local Impact Map
                    </h1>
                    <p
                        class="font-sans text-base md:text-lg text-white/90 mt-4 md:mt-6 border-l-4 border-primary pl-4 md:pl-5 py-2 md:py-3 bg-black/30 backdrop-blur-md font-medium rounded-r-xl">
                        Report civic issues. Track contributions. Earn citizen rewards. Improve your city.
                    </p>
                    <div class="mt-6 md:mt-8 flex gap-4">
                        <button onclick="toggleMap()" id="toggle-map-btn"
                            class="px-4 py-2 md:px-8 md:py-4 rounded-xl border border-primary/50 bg-primary text-white font-mono text-xs md:text-sm font-bold hover:bg-forest-moss transition-all duration-300 hover:shadow-[0_8px_20px_rgba(70,138,94,0.4)] flex items-center gap-2 btn-ripple">
                            <span class="material-symbols-outlined text-sm md:text-lg">visibility_off</span> Hide Geographical Map
                        </button>
                    </div>
                </div>
                <div class="flex gap-4 self-stretch md:self-auto">
                    <div
                        class="glass-card rounded-xl p-4 md:p-6 bg-red-900/40 border border-red-500/30 flex-1 min-w-[140px] text-center transition-all duration-300 flex flex-col justify-center">
                        <p class="font-mono text-[10px] md:text-xs text-white/80 font-bold uppercase tracking-wider mb-2">Active
                            Reports</p>
                        <p class="font-cabin text-4xl md:text-5xl text-white drop-shadow-md" id="active-count">0</p>
                    </div>
                    <div
                        class="glass-card rounded-xl p-6 bg-green-900/40 border border-green-500/30 flex-1 min-w-[140px] text-center transition-all duration-300 flex flex-col justify-center">
                        <p class="font-mono text-xs text-white/80 font-bold uppercase tracking-wider mb-2">GCP Balance
                        </p>
                        <p class="font-cabin text-5xl text-white drop-shadow-md" id="gcp-display">0</p>
                    </div>
                </div>
            </section>

            <!-- Map Section -->
            <section class="w-full mb-12 animate-slide-up" style="animation-delay: 0.1s;">
                <div id="map-container"
                    class="flex w-full glass-card rounded-xl h-[450px] overflow-hidden group flex-col border border-white/10 transition-all duration-500 relative">

                    <div id="leaflet-map" class="w-full h-full z-0 flex-grow"></div>

                    <div
                        class="absolute bottom-6 right-6 rounded-xl bg-black/60 backdrop-blur-md border border-white/10 p-4 flex flex-col gap-3 shadow-xl z-10 select-none">
                        <div class="flex items-center gap-3">
                            <div
                                class="w-5 h-5 bg-orange-500 rounded border border-white/20 shadow-sm flex items-center justify-center">
                                <span class="material-symbols-outlined text-[12px] text-white">construction</span></div>
                            <span class="text-xs font-mono text-white font-bold">Roads/Infra</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <div
                                class="w-5 h-5 bg-red-500 rounded border border-white/20 shadow-sm flex items-center justify-center">
                                <span class="material-symbols-outlined text-[12px] text-white">delete</span></div>
                            <span class="text-xs font-mono text-white font-bold">Garbage</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <div
                                class="w-5 h-5 bg-blue-500 rounded border border-white/20 shadow-sm flex items-center justify-center">
                                <span class="material-symbols-outlined text-[12px] text-white">pets</span></div>
                            <span class="text-xs font-mono text-white font-bold">Animals/Nature</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <div
                                class="w-5 h-5 bg-cyan-500 rounded border border-white/20 shadow-sm flex items-center justify-center">
                                <span class="material-symbols-outlined text-[12px] text-white">water_drop</span></div>
                            <span class="text-xs font-mono text-white font-bold">Water</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <div
                                class="w-5 h-5 bg-gray-500 rounded border border-white/20 shadow-sm flex items-center justify-center">
                                <span class="material-symbols-outlined text-[12px] text-white">help_outline</span></div>
                            <span class="text-xs font-mono text-white font-bold">Others</span>
                        </div>
                    </div>
                </div>
            </section>
            </section>

            <!-- Board Section (Recent Posts) -->
            <section id="feed-container" class="w-full space-y-8 animate-slide-up" style="animation-delay: 0.2s;">
                <div
                    class="flex flex-col md:flex-row justify-between items-start md:items-center px-2 select-none gap-6">
                    <h2 class="font-cabin text-4xl text-white font-bold flex items-center gap-3 drop-shadow-md">
                        <span class="material-symbols-outlined text-4xl">list_alt</span> Recent Reports
                    </h2>
                    <a href="/community.html"
                        class="px-5 py-2.5 rounded-lg text-xs font-mono bg-primary text-white font-bold hover:bg-forest-moss transition-all flex items-center gap-1 shadow-md">
                        View All <span class="material-symbols-outlined text-sm">arrow_forward</span>
                    </a>
                </div>

                <div id="board-feed" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
                </div>
            </section>
        </main>
    </div>

    <anek-footer></anek-footer>

    <script type="module">
        // Check local current user session
        let currentUser = JSON.parse(localStorage.getItem('anek_current_user') || '{"name":"Citizen","username":"citizen"}');

        if (document.getElementById('header-username')) document.getElementById('header-username').innerText = '@' + currentUser.username;
        if (document.getElementById('profile-name')) document.getElementById('profile-name').innerText = currentUser.name;
        if (document.getElementById('profile-username')) document.getElementById('profile-username').innerText = '@' + currentUser.username;
        if (document.getElementById('profile-avatar')) document.getElementById('profile-avatar').innerText = currentUser.name.charAt(0).toUpperCase();

        let issues = [];
        let leafletMap = null;
        let markersLayer = null;

        function initMap(lat, lng) {
            if (leafletMap) return;

            leafletMap = L.map('leaflet-map', {
                scrollWheelZoom: true
            }).setView([lat, lng], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(leafletMap);

            markersLayer = L.layerGroup().addTo(leafletMap);
        }

        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        initMap(lat, lng);
                        fetchIssues();
                    },
                    (error) => {
                        console.warn('Geolocation access denied. Using defaults.');
                        initMap(52.5200, 13.4050); // Berlin fallback
                        fetchIssues();
                    }
                );
            } else {
                initMap(52.5200, 13.4050);
                fetchIssues();
            }
        }

        async function loadUserProfile() {
            try {
                const response = await apiFetch('/users/profile');
                if (response && response.ok) {
                    const data = await response.json();
                    currentUser.name = data.user.name;
                    currentUser.username = data.user.username;
                    localStorage.setItem('anek_current_user', JSON.stringify(currentUser));

                    if (document.getElementById('header-username')) document.getElementById('header-username').innerText = '@' + currentUser.username;
                    if (document.getElementById('gcp-display')) document.getElementById('gcp-display').innerText = data.user.points;
                }
            } catch (err) {
                console.error('Error loading profile:', err);
            }
        }

        async function fetchIssues() {
            const feed = document.getElementById('board-feed');
            if (feed) feed.innerHTML = '<div class="col-span-full py-12 flex justify-center"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div></div>';
            try {
                const response = await apiFetch('/issues');
                if (response && response.ok) {
                    const data = await response.json();
                    issues = data.issues;
                    renderMapMarkers();
                    renderFeed();
                }
            } catch (err) {
                console.error('Error fetching issues:', err);
            }
        }

        let currentFilter = 'all';

        // Render feed posts dynamically (only top 3)
        function renderFeed() {
            const feed = document.getElementById('board-feed');
            if (!feed) return;
            feed.innerHTML = '';

            const recentReports = issues;

            if (recentReports.length === 0) {
                feed.innerHTML = `
                    <div class="col-span-full glass-card border border-white/10 p-12 rounded-xl text-center text-white/80 font-sans text-sm flex flex-col items-center justify-center min-h-[300px]">
                        <span class="material-symbols-outlined text-7xl mb-6 drop-shadow-md text-green-400">eco</span>
                        <p class="font-bold text-white text-2xl mb-2">Everything looks clean!</p>
                        <p class="text-lg">No reports available right now.</p>
                    </div>
                `;
                return;
            }

            recentReports.forEach((issue, index) => {
                const article = document.createElement('article');
                article.id = `issue-post-${issue.id}`;

                // Status & Category styles
                let statusClass = "bg-red-500/20 text-red-300";
                let catIcon = "construction";
                let catColor = "bg-orange-500";
                let cardBg = "bg-[#0d2116]/80";

                if (issue.status === 'In Progress') {
                    statusClass = "bg-blue-500/20 text-blue-300";
                } else if (issue.status === 'Completed') {
                    statusClass = "bg-green-500/20 text-green-300";
                }

                if (issue.category === 'Garbage') { catIcon = "delete"; catColor = "bg-red-500"; }
                if (issue.category === 'Animals') { catIcon = "pets"; catColor = "bg-blue-500"; }
                if (issue.category === 'Water') { catIcon = "water_drop"; catColor = "bg-blue-500"; }

                article.className = `${cardBg} backdrop-blur-md rounded-xl p-6 transition-all duration-300 flex flex-col justify-between hover:scale-[1.02] animate-slide-up group relative`;
                article.style.animationDelay = `${0.1 * index}s`;

                let takeActionBtn = '';
                if (issue.status === 'Reported') {
                    takeActionBtn = `<button onclick="takeResponsibility('${issue.id}')" class="px-3 py-1.5 rounded-lg border border-primary bg-primary/80 text-white text-[10px] font-mono font-bold hover:bg-primary transition-all">TAKE RESPONSIBILITY</button>`;
                } else if (issue.status === 'In Progress') {
                    if (issue.responsibleUser === currentUser.username) {
                        takeActionBtn = `
                            <div class="flex gap-2">
                                <button onclick="dropResponsibility('${issue.id}')" class="px-3 py-1.5 rounded-lg border border-red-500/50 bg-red-500/20 text-red-300 text-[10px] font-mono font-bold hover:bg-red-500/40 transition-all">DROP</button>
                                <button onclick="completeIssue('${issue.id}')" class="px-3 py-1.5 rounded-lg border border-green-500/50 bg-green-500/20 text-green-300 text-[10px] font-mono font-bold hover:bg-green-500/40 transition-all">MARK RESOLVED</button>
                            </div>
                        `;
                    } else {
                        takeActionBtn = `<span class="text-[10px] font-mono text-white/50 italic">Assigned to @${issue.responsibleUser}</span>`;
                    }
                } else if (issue.status === 'Completed') {
                    takeActionBtn = `<span class="text-[10px] font-mono text-green-400 font-bold flex items-center gap-1"><span class="material-symbols-outlined text-sm">verified</span> Verified</span>`;
                }

                article.innerHTML = `
                    <header class="flex justify-between items-start mb-4 select-none">
                        <div class="flex gap-3">
                            <div class="w-10 h-10 rounded-full border border-white/20 shadow-md flex items-center justify-center font-cabin text-white font-bold ${catColor}">
                                <span class="material-symbols-outlined text-xl">${catIcon}</span>
                            </div>
                            <div>
                                <h4 class="font-cabin text-2xl text-white leading-tight drop-shadow-sm">${issue.title}</h4>
                                <p class="font-mono text-xs text-white/60 mt-1">@${issue.author} · ${issue.time}</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <span class="px-2 py-1 rounded-md text-[10px] font-mono uppercase font-bold ${statusClass}">${issue.status}</span>
                            <a href="/issue_detail.html?id=${issue.id}" class="w-8 h-8 rounded-full text-primary hover:text-green-400 transition-colors flex items-center justify-center">
                                <span class="material-symbols-outlined text-lg">arrow_forward</span>
                            </a>
                        </div>
                    </header>
                    <div class="font-sans text-sm text-white/90 mb-6 leading-relaxed">
                        ${issue.description}
                    </div>
                    
                    ${(issue.status === 'Completed' || issue.mediaUrl) ? `
                    <div class="w-full h-32 rounded-lg overflow-hidden border border-white/10 mb-6 select-none shadow-inner">
                        <img class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity duration-300" src="${issue.mediaUrl || 'https://images.unsplash.com/photo-1542385151-efd9000785a0?w=500&q=80'}"/>
                    </div>` : ''}

                    <div class="border-t border-white/10 pt-4 flex justify-between items-center select-none">
                        <div class="flex gap-4">
                            <button onclick="upvoteIssue('${issue.id}')" class="flex items-center gap-2 ${issue.isVotedByMe ? 'text-primary' : 'text-white/60'} hover:text-primary transition-colors hover:scale-110">
                                <span class="material-symbols-outlined text-2xl">thumb_up</span>
                                <span class="font-mono text-lg font-bold">${issue.votes}</span>
                            </button>
                            <button onclick="toggleInlineChat('${issue.id}')" class="flex items-center gap-2 text-white/60 hover:text-primary transition-colors hover:scale-110">
                                <span class="material-symbols-outlined text-2xl">chat_bubble</span>
                                <span class="font-mono text-lg font-bold">${issue.comments.length}</span>
                            </button>
                        </div>
                        ${takeActionBtn}
                    </div>
                    
                    <div id="chat-inline-${issue.id}" class="hidden flex-col border-t border-white/10 mt-4 pt-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-mono text-[10px] font-bold text-white/60 uppercase tracking-wider">Replies</span>
                            <button onclick="toggleInlineChat('${issue.id}')" class="text-white/40 hover:text-white transition-colors material-symbols-outlined text-sm">close</button>
                        </div>
                        <div id="chat-messages-${issue.id}" class="max-h-60 overflow-y-auto space-y-3 mb-3 pr-2 custom-scrollbar">
                            <!-- Messages -->
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="chat-input-${issue.id}" class="flex-grow bg-black/30 border border-white/10 rounded-lg px-3 py-2 font-sans text-sm text-white focus:outline-none focus:border-primary/50 transition-colors" placeholder="Post a reply..." onkeypress="if(event.key === 'Enter') sendInlineChat('${issue.id}')">
                            <button onclick="sendInlineChat('${issue.id}')" class="px-4 py-2 bg-primary text-white rounded-lg font-mono text-xs font-bold hover:bg-forest-moss transition-colors">REPLY</button>
                        </div>
                    </div>
                `;
                feed.appendChild(article);
            });
        }

        // Render map markers only
        function renderMapMarkers() {
            // Update active count badge
            document.getElementById('active-count').innerText = issues.filter(i => i.status !== 'Completed').length;

            if (markersLayer) {
                markersLayer.clearLayers();

                issues.forEach(issue => {
                    const coords = issue.location && issue.location.coordinates
                        ? issue.location.coordinates
                        : [13.4050, 52.5200];
                    const lng = coords[0];
                    const lat = coords[1];

                    let iconName = 'help_outline';
                    let iconColor = 'text-white';
                    let iconBg = 'bg-gray-500';

                    if (issue.category === 'Roads') {
                        iconName = 'construction';
                        iconColor = 'text-white';
                        iconBg = 'bg-orange-500';
                    } else if (issue.category === 'Garbage') {
                        iconName = 'delete';
                        iconColor = 'text-white';
                        iconBg = 'bg-red-500';
                    } else if (issue.category === 'Animals') {
                        iconName = 'pets';
                        iconColor = 'text-white';
                        iconBg = 'bg-blue-500';
                    } else if (issue.category === 'Water') {
                        iconName = 'water_drop';
                        iconColor = 'text-white';
                        iconBg = 'bg-cyan-500';
                    }

                    const customIcon = L.divIcon({
                        className: 'custom-leaflet-marker',
                        html: `
                            <div class="p-2 ${iconBg} border-2 border-primary brutalist-shadow rounded-sm flex items-center justify-center -translate-x-1/2 -translate-y-1/2 cursor-pointer transition-transform duration-300 hover:scale-110 shadow-md">
                                <span class="material-symbols-outlined ${iconColor} text-sm font-bold">${iconName}</span>
                            </div>
                        `,
                        iconSize: [32, 32],
                        iconAnchor: [16, 16]
                    });

                    L.marker([lat, lng], { icon: customIcon })
                        .bindPopup(`
                            <div class="font-sans p-1 min-w-[150px] text-black">
                                <h5 class="font-cabin text-sm font-bold text-black mb-0.5">${issue.title}</h5>
                                <p class="font-mono text-[10px] text-black mb-1 uppercase tracking-wider">${issue.category} · ${issue.status}</p>
                                <p class="text-[10px] text-black mb-2">${issue.description.substring(0, 50)}...</p>
                                <a href="/issue_detail.html?id=${issue.id}" class="w-full inline-block text-center px-sm py-1 border-2 border-primary bg-primary !text-white font-mono text-[10px] font-bold hover:bg-forest-moss transition-colors">VIEW DETAILS</a>
                            </div>
                        `)
                        .addTo(markersLayer);
                });
            }
        }

        // Upvote post function
        window.upvoteIssue = async function (id) {
            const token = localStorage.getItem('anek_access_token');
            if (!token) {
                alert('You must be logged in to upvote issues.');
                return;
            }

            const issueIndex = issues.findIndex(i => i.id === id);
            let previousVotes = 0;
            let previousIsVotedByMe = false;
            const upvoteBtn = document.querySelector(`#issue-post-${id} button[onclick="upvoteIssue('${id}')"] span:last-child`);

            // Optimistic update
            if (issueIndex > -1 && upvoteBtn) {
                previousVotes = issues[issueIndex].votes;
                previousIsVotedByMe = issues[issueIndex].isVotedByMe;

                if (previousIsVotedByMe) {
                    issues[issueIndex].votes = Math.max(0, issues[issueIndex].votes - 1);
                    issues[issueIndex].isVotedByMe = false;
                    upvoteBtn.parentElement.classList.remove('text-primary');
                    upvoteBtn.parentElement.classList.add('text-on-surface-variant');
                } else {
                    issues[issueIndex].votes += 1;
                    issues[issueIndex].isVotedByMe = true;
                    upvoteBtn.parentElement.classList.add('text-primary');
                    upvoteBtn.parentElement.classList.remove('text-on-surface-variant');
                }
                upvoteBtn.innerText = issues[issueIndex].votes;
            }

            try {
                const response = await apiFetch(`/issues/${id}/upvote`, {
                    method: 'POST'
                });
                if (response && response.ok) {
                    const data = await response.json();
                    if (issueIndex > -1 && upvoteBtn) {
                        issues[issueIndex].votes = data.votes;
                        issues[issueIndex].isVotedByMe = data.isVotedByMe;
                        upvoteBtn.innerText = data.votes;
                        if (data.isVotedByMe) {
                            upvoteBtn.parentElement.classList.add('text-primary');
                            upvoteBtn.parentElement.classList.remove('text-on-surface-variant');
                        } else {
                            upvoteBtn.parentElement.classList.remove('text-primary');
                            upvoteBtn.parentElement.classList.add('text-on-surface-variant');
                        }
                    }
                } else {
                    // Revert
                    if (issueIndex > -1 && upvoteBtn) {
                        issues[issueIndex].votes = previousVotes;
                        issues[issueIndex].isVotedByMe = previousIsVotedByMe;
                        upvoteBtn.innerText = previousVotes;
                        if (previousIsVotedByMe) {
                            upvoteBtn.parentElement.classList.add('text-primary');
                            upvoteBtn.parentElement.classList.remove('text-on-surface-variant');
                        } else {
                            upvoteBtn.parentElement.classList.remove('text-primary');
                            upvoteBtn.parentElement.classList.add('text-on-surface-variant');
                        }
                    }
                    if (response) {
                        const data = await response.json();
                        alert(data.message || 'Error upvoting issue');
                    }
                }
            } catch (err) {
                if (issueIndex > -1 && upvoteBtn) {
                    issues[issueIndex].votes = previousVotes;
                    issues[issueIndex].isVotedByMe = previousIsVotedByMe;
                    upvoteBtn.innerText = previousVotes;
                    if (previousIsVotedByMe) {
                        upvoteBtn.parentElement.classList.add('text-primary');
                        upvoteBtn.parentElement.classList.remove('text-on-surface-variant');
                    } else {
                        upvoteBtn.parentElement.classList.remove('text-primary');
                        upvoteBtn.parentElement.classList.add('text-on-surface-variant');
                    }
                }
                console.error('Error upvoting:', err);
                alert('An error occurred while upvoting.');
            }
        };

        window.takeResponsibility = async function (id) {
            if (confirm("You sure you want to handle this? Don't back out later!")) {
                const btn = document.querySelector(`#issue-post-${id} button[onclick="takeResponsibility('${id}')"]`);
                const oldHtml = btn ? btn.outerHTML : '';
                if (btn) {
                    btn.outerHTML = `<button disabled class="px-sm py-1 border-2 border-primary text-[10px] font-mono font-bold bg-blue-100 text-blue-800 opacity-50">CLAIMING...</button>`;
                }
                try {
                    const response = await apiFetch(`/issues/${id}/take-responsibility`, {
                        method: 'POST'
                    });
                    if (response && response.ok) {
                        fetchIssues();
                    } else if (btn) {
                        const loadingBtn = document.querySelector(`#issue-post-${id} button[disabled]`);
                        if (loadingBtn) loadingBtn.outerHTML = oldHtml;
                    }
                } catch (err) {
                    if (btn) {
                        const loadingBtn = document.querySelector(`#issue-post-${id} button[disabled]`);
                        if (loadingBtn) loadingBtn.outerHTML = oldHtml;
                    }
                    console.error('Error claiming:', err);
                }
            }
        };

        // Drop responsibility of post
        window.dropResponsibility = async function (id) {
            if (confirm("Giving up already? You sure you wanna drop this?")) {
                const btn = document.querySelector(`#issue-post-${id} button[onclick="dropResponsibility('${id}')"]`);
                const oldHtml = btn ? btn.outerHTML : '';
                if (btn) {
                    btn.outerHTML = `<button disabled class="px-sm py-1 border-2 border-primary text-[10px] font-mono font-bold bg-red-100 text-red-800 opacity-50">DROPPING...</button>`;
                }
                try {
                    const response = await apiFetch(`/issues/${id}/drop-responsibility`, {
                        method: 'POST'
                    });
                    if (response && response.ok) {
                        fetchIssues();
                    } else if (btn) {
                        const loadingBtn = document.querySelector(`#issue-post-${id} button[disabled]`);
                        if (loadingBtn) loadingBtn.outerHTML = oldHtml;
                    }
                } catch (err) {
                    if (btn) {
                        const loadingBtn = document.querySelector(`#issue-post-${id} button[disabled]`);
                        if (loadingBtn) loadingBtn.outerHTML = oldHtml;
                    }
                    console.error('Error dropping:', err);
                }
            }
        };


        window.completeIssue = async function (id) {
            if (confirm("Job done? Mark it complete to earn GCP!")) {
                const btn = document.querySelector(`#issue-post-${id} button[onclick="completeIssue('${id}')"]`);
                const oldHtml = btn ? btn.outerHTML : '';
                if (btn) {
                    btn.outerHTML = `<button disabled class="px-sm py-1 border-2 border-primary text-[10px] font-mono font-bold bg-green-100 text-green-800 opacity-50">COMPLETING...</button>`;
                }
                try {
                    const response = await apiFetch(`/issues/${id}/resolve`, {
                        method: 'POST'
                    });
                    if (response && response.ok) {
                        alert("Boom! Issue fixed. You just bagged +50 GCP. You rock!");
                        loadUserProfile();
                        fetchIssues();
                    } else if (btn) {
                        const loadingBtn = document.querySelector(`#issue-post-${id} button[disabled]`);
                        if (loadingBtn) loadingBtn.outerHTML = oldHtml;
                    }
                } catch (err) {
                    if (btn) {
                        const loadingBtn = document.querySelector(`#issue-post-${id} button[disabled]`);
                        if (loadingBtn) loadingBtn.outerHTML = oldHtml;
                    }
                    console.error('Error resolving:', err);
                }
            }
        };

        // Filter the board
        window.filterBoard = function (category) {
            currentFilter = category;
            document.querySelectorAll('[id^="filter-btn-"]').forEach(btn => {
                btn.classList.remove('bg-primary', 'shadow-md');
                btn.classList.add('bg-white/10');
            });
            const activeBtn = document.getElementById(`filter-btn-${category}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-white/10');
                activeBtn.classList.add('bg-primary', 'shadow-md');
            }
            renderFeed();
        };

        // Highlight feed post from map pin
        window.highlightFeedPost = function (title) {
            const found = issues.find(i => i.title.includes(title));
            if (found) {
                if (currentFilter !== 'all' && currentFilter !== found.category) {
                    filterBoard('all');
                }
                const post = document.getElementById(`issue-post-${found.id}`);
                if (post) {
                    post.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    post.style.borderColor = '#c5a059';
                    post.style.boxShadow = '8px 8px 0px 0px #c5a059';
                    setTimeout(() => {
                        post.style.borderColor = '#2d4d3c';
                        post.style.boxShadow = '4px 4px 0px 0px #2d4d3c';
                    }, 2000);
                }
            }
        };

        window.toggleMap = function () {
            const container = document.getElementById('map-container');
            const btn = document.getElementById('toggle-map-btn');

            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                btn.innerHTML = '<span class="material-symbols-outlined text-lg">visibility_off</span> Hide Geographical Map';
                // Trigger Leaflet to resize correctly since it was hidden
                if (leafletMap) {
                    setTimeout(() => leafletMap.invalidateSize(), 100);
                }
            } else {
                container.classList.add('hidden');
                btn.innerHTML = '<span class="material-symbols-outlined text-lg">visibility</span> Show Geographical Map';
            }
        };

        window.toggleInlineChat = function (id) {
            const chatBox = document.getElementById(`chat-inline-${id}`);
            if (chatBox.classList.contains('hidden')) {
                chatBox.classList.remove('hidden');
                chatBox.classList.add('flex');
                renderInlineChatMessages(id);
            } else {
                chatBox.classList.add('hidden');
                chatBox.classList.remove('flex');
            }
        };

        window.sendInlineChat = async function (id) {
            const token = localStorage.getItem('anek_access_token');
            if (!token) {
                alert('You must be logged in to post a reply.');
                return;
            }

            const input = document.getElementById(`chat-input-${id}`);
            const text = input.value.trim();
            if (!text) return;

            // Optimistic UI for chat
            const issueIndex = issues.findIndex(i => i.id === id);
            const currentUser = JSON.parse(localStorage.getItem('anek_current_user') || '{}');
            let tempCommentId = 'temp_' + Date.now();
            let newComment = { id: tempCommentId, author: currentUser.username || 'citizen', text, createdAt: new Date().toISOString() };

            if (issueIndex > -1) {
                issues[issueIndex].comments.push(newComment);
                renderInlineChatMessages(id);
                // Also bump comment count if possible
                const countSpan = document.querySelector(`#issue-post-${id} button[onclick="toggleInlineChat('${id}')"] span:last-child`);
                if (countSpan) countSpan.innerText = issues[issueIndex].comments.length;
            }

            input.value = '';

            try {
                const response = await apiFetch('/comments', {
                    method: 'POST',
                    body: JSON.stringify({ issueId: id, text })
                });
                if (response && response.ok) {
                    const data = await response.json();
                    if (issueIndex > -1) {
                        // Swap temp ID with real one
                        const commentIdx = issues[issueIndex].comments.findIndex(c => c.id === tempCommentId);
                        if (commentIdx > -1) {
                            issues[issueIndex].comments[commentIdx] = data.comment;
                        }
                    }
                    fetchIssues(); // Silent refresh syncs state in background
                } else {
                    // Revert
                    if (issueIndex > -1) {
                        issues[issueIndex].comments = issues[issueIndex].comments.filter(c => c.id !== tempCommentId);
                        renderInlineChatMessages(id);
                        const countSpan = document.querySelector(`#issue-post-${id} button[onclick="toggleInlineChat('${id}')"] span:last-child`);
                        if (countSpan) countSpan.innerText = issues[issueIndex].comments.length;
                    }
                    if (response) {
                        const data = await response.json();
                        alert(data.message || 'Error posting comment');
                    }
                }
            } catch (err) {
                // Revert
                if (issueIndex > -1) {
                    issues[issueIndex].comments = issues[issueIndex].comments.filter(c => c.id !== tempCommentId);
                    renderInlineChatMessages(id);
                    const countSpan = document.querySelector(`#issue-post-${id} button[onclick="toggleInlineChat('${id}')"] span:last-child`);
                    if (countSpan) countSpan.innerText = issues[issueIndex].comments.length;
                }
                console.error('Error posting comment:', err);
                alert('An error occurred while posting comment.');
            }
        };

        window.renderInlineChatMessages = function (id) {
            const issue = issues.find(i => i.id === id);
            const container = document.getElementById(`chat-messages-${id}`);
            container.innerHTML = '';

            if (!issue || !issue.comments || issue.comments.length === 0) {
                container.innerHTML = '<p class="text-center font-mono text-xs text-on-surface-variant italic py-2">No comments yet. Be the first to reply!</p>';
                return;
            }

            issue.comments.forEach(comment => {
                const isMe = comment.author === currentUser.username;
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;

                msgDiv.innerHTML = `
                    <div class="max-w-[85%] p-2 ${isMe ? 'bg-primary-container text-on-primary-container rounded-tl-lg rounded-bl-lg rounded-tr-sm border border-primary' : 'bg-white text-on-surface rounded-tr-lg rounded-br-lg rounded-tl-sm border border-outline-variant'}">
                        <p class="font-mono text-[10px] font-bold ${isMe ? 'text-primary' : 'text-on-surface-variant'} mb-0.5">@${comment.author}</p>
                        <p class="font-sans text-xs">${comment.text}</p>
                    </div>
                `;
                container.appendChild(msgDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        // Onboarding Welcome
        function showWelcomeToast() {
            if (!localStorage.getItem('anek_onboarded_v2')) {
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-6 right-6 glass-card rounded-xl p-6 z-50 animate-slide-up border border-primary/50 shadow-2xl max-w-sm';
                toast.innerHTML = `
                    <h4 class="font-cabin text-2xl text-white mb-4 flex items-center gap-2"><span class="material-symbols-outlined text-3xl text-yellow-400">waving_hand</span> Welcome to Anēk!</h4>
                    <ol class="list-decimal list-inside font-sans text-sm text-white/90 space-y-3 mb-6 pl-2">
                        <li><strong>Report</strong> local civic issues.</li>
                        <li><strong>Explore</strong> the interactive map.</li>
                        <li><strong>Earn</strong> citizen rewards.</li>
                    </ol>
                    <button class="w-full px-4 py-3 bg-primary text-white font-mono text-sm font-bold rounded-lg hover:bg-forest-moss transition-colors btn-ripple" onclick="this.parentElement.remove(); localStorage.setItem('anek_onboarded_v2', 'true');">LET'S GO</button>
                `;
                document.body.appendChild(toast);
            }
        }

        // Start initialization
        loadUserProfile();
        getUserLocation();
        showWelcomeToast();
    </script>



</body>

</html>
